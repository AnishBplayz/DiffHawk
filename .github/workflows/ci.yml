name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch; the last push is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres is provided on purpose. The exactly-once backfill tests SKIP when
    # no database is reachable, which keeps a fresh clone green — but it would
    # also mean the single most important guarantee in the project silently never
    # ran in CI. Green has to mean those tests actually executed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diffhawk
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d diffhawk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/diffhawk

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck (engine, CLI, worker)
        run: bunx tsc --noEmit

      - name: Typecheck (API — NestJS decorators need their own config)
        working-directory: apps/api
        run: bunx tsc --noEmit

      - name: Typecheck (web)
        working-directory: apps/web
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Assert the database-backed tests actually ran
        # Without this, a Postgres outage would turn the exactly-once suite into
        # a silent skip and CI would still be green. Fail loudly instead.
        run: |
          if bun test apps/worker 2>&1 | grep -q "no Postgres at"; then
            echo "::error::Exactly-once backfill tests skipped — Postgres was unreachable in CI."
            exit 1
          fi
          echo "Database-backed tests executed against a real Postgres."

      - name: Build web
        working-directory: apps/web
        run: bun run build

      - name: Build publishable npm bundle
        run: bun run build:npm

      - name: Verify the npm bundle runs on plain node
        # The published package targets node, not bun. A bundle that only works
        # under bun would break `npx diffhawk` for most users, and that has
        # happened once already (the shebang was wrong).
        run: |
          head -1 dist-npm/diffhawk.js | grep -qx '#!/usr/bin/env node' \
            || { echo "::error::bundle shebang is not node"; exit 1; }
          node dist-npm/diffhawk.js --help > /dev/null
          echo "npm bundle runs under $(node --version)."

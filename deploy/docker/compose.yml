# One command to run the whole system locally: api + worker + postgres + redis.
#
# The API and worker are separate services on purpose, not for tidiness. The API
# is latency-bound (a webhook must answer inside GitHub's 10s timeout) while the
# worker is rate-limit bound and may take minutes on one job. Scaling them
# together would mean over-provisioning one to serve the other.
name: diffhawk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diffhawk
    ports: ['5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d diffhawk']
      interval: 5s
      retries: 10
    volumes: ['pgdata:/var/lib/postgresql/data']

  redis:
    image: redis:7-alpine
    # No persistence: Redis is transport here, not the record. Losing it costs
    # in-flight jobs, which are re-enqueued from non-terminal Postgres rows.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    command: ['bun', 'run', 'apps/api/src/main.ts']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/diffhawk
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      PORT: '3200'
    ports: ['3200:3200']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'bun', '-e', "await fetch('http://127.0.0.1:3200/healthz')"]
      interval: 10s
      retries: 5

  worker:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    command: ['bun', 'run', 'apps/worker/src/main.ts']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/diffhawk
      REDIS_URL: redis://redis:6379
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WORKER_CONCURRENCY: '4'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Safe to scale: the GitHub budget lives in a Redis token bucket shared by
    # every replica, so replicas raise throughput only up to that budget.
    # docker compose up --scale worker=3
    stop_grace_period: 30s

volumes:
  pgdata:

name: DiffHawk
description: Measure whether an AI code reviewer is actually working on a repo, and post a scorecard.
author: Anish Bhutra
branding:
  icon: eye
  color: purple

inputs:
  token:
    # No ${{ }} in this text. GitHub evaluates expressions inside input
    # descriptions too, and `secrets` is not a valid context in action.yml, so
    # mentioning it that way makes the whole action fail to load.
    description: "GitHub token used to read PRs and post the scorecard. Usually secrets.GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  repo:
    description: "Repository to score as owner/name. Defaults to the repository the workflow runs in. Use this to score another repo and report the scorecard here."
    required: false
  reviewer:
    description: Restrict scoring to one reviewer (e.g. CodeRabbit). Default auto-detects the most active.
    required: false
  days:
    description: Reporting window in days.
    required: false
    default: "90"
  prs:
    description: Recent pull requests to inspect (must cover two windows for trend detection).
    required: false
    default: "120"
  post:
    description: Post/update the scorecard comment. Set to "false" to only write the job summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3"
    - shell: bash
      # The action ships its own source; install its deps then run the entrypoint.
      run: |
        cd "${{ github.action_path }}"
        bun install --frozen-lockfile
        bun run apps/action/src/main.ts
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_REVIEWER: ${{ inputs.reviewer }}
        INPUT_DAYS: ${{ inputs.days }}
        INPUT_PRS: ${{ inputs.prs }}
        INPUT_POST: ${{ inputs.post }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
